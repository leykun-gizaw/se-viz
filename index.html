<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SE-Viz — Memory & Algorithm Visualizer</title>
    <!--
      Resolve the theme before first paint: light is the default, with the instructor's last choice
      persisted (an explicit `dark` preference is honored). Setting data-theme + colorScheme +
      background here (synchronously, in <head>) means no flash before the bundled CSS/JS loads.
    -->
    <script>
      (function () {
        var t = 'light';
        try {
          if (localStorage.getItem('se-viz-theme') === 'dark') t = 'dark';
        } catch (e) {
          /* localStorage unavailable — fall back to the light default */
        }
        var root = document.documentElement;
        root.dataset.theme = t;
        root.style.colorScheme = t;
        root.style.background = t === 'light' ? '#f5f4f1' : '#0d0e11';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
